apiVersion: v1
kind: Namespace
metadata:
  name: buildforge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildforge-app
  namespace: buildforge
  labels: { app: buildforge }
spec:
  replicas: 3
  selector: { matchLabels: { app: buildforge } }
  template:
    metadata: { labels: { app: buildforge } }
    spec:
      containers:
        - name: app
          image: ghcr.io/buildforge/app:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: buildforge-secrets, key: database-url } }
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: buildforge-secrets, key: auth-secret } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: buildforge-secrets, key: openai-key } }
            - name: REDIS_URL
              value: redis://buildforge-redis:6379
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 1,    memory: 1Gi   }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: buildforge-app
  namespace: buildforge
spec:
  type: ClusterIP
  selector: { app: buildforge }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: buildforge-app
  namespace: buildforge
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: buildforge-app }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildforge-app
  namespace: buildforge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls: [{ hosts: [app.buildforge.ai], secretName: buildforge-tls }]
  rules:
    - host: app.buildforge.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: buildforge-app, port: { number: 80 } } }
